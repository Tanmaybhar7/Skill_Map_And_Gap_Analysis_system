<!DOCTYPE html>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar-wrapper">
      <a href="/dashboard.html" class="sidebar-brand"><i class="bi bi-diagram-3-fill text-primary me-2"></i>Skill_Map</a>
      <div class="sidebar-nav">
        <div class="nav-category">Main Console</div>
        <a href="/dashboard.html" class="nav-link-custom"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <div class="nav-category">Intelligence Engines</div>
        <a href="/pages/skill-mapping.html" class="nav-link-custom"><i class="bi bi-cpu"></i> Skill Mapping</a>
        <a href="/pages/gap-analysis.html" class="nav-link-custom"><i class="bi bi-graph-up-arrow"></i> Gap Analysis Engine</a>

      <div class="p-3 border-top"><button class="btn btn-outline-danger w-100" onclick="AuthManager.logout()">Sign Out</button></div>

    <main class="main-content">
      <header class="topbar">
        <div class="d-flex align-items-center">
          <button class="btn btn-light me-3" id="sidebarToggleBtn"><i class="bi bi-list fs-5"></i></button>

        <div class="card card-custom p-4 mb-4">

          <div class="table-responsive">
            <table class="table table-custom text-center align-middle" id="matrixTable">
              <thead>

                  <th>HTML</th>
                  <th>CSS</th>

                  <th>React</th>
                  <th>Node.js</th>
                  <th>Express</th>

                </tr>

              <tbody>
                <!-- Populated dynamically by skills.js -->
              </tbody>
            </table>
          </div>
        </div>

        <h5 class="fw-bold mb-3">Skill Directory</h5>
        <div class="row g-4" id="skillsGrid">
          <!-- Skills Grid -->
        </div>
      </div>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates - Skill_Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar-wrapper">
      <a href="/dashboard.html" class="sidebar-brand"><i class="bi bi-diagram-3-fill text-primary me-2"></i>Skill_Map</a>
      <div class="sidebar-nav">
        <div class="nav-category">Main Console</div>
        <a href="/dashboard.html" class="nav-link-custom"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <div class="nav-category">Outputs & Audit</div>
        <a href="/pages/certificates.html" class="nav-link-custom active"><i class="bi bi-patch-check"></i> Certificates</a>
      </div>
      <div class="p-3 border-top"><button class="btn btn-outline-danger w-100" onclick="AuthManager.logout()">Sign Out</button></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="d-flex align-items-center">
          <button class="btn btn-light me-3" id="sidebarToggleBtn"><i class="bi bi-list fs-5"></i></button>
          <h5 class="fw-bold mb-0">Dynamic Certificate Generator & Verification</h5>
        </div>
      </header>

      <div class="p-4 text-center">
        <div class="card card-custom p-4 d-inline-block shadow-lg">
          <canvas id="certificateCanvas" class="img-fluid border rounded-3 mb-4"></canvas>
          <div>
            <button class="btn btn-primary rounded-pill px-4 me-2" onclick="window.print()"><i class="bi bi-download me-1"></i> Download PDF Certificate</button>
            <button class="btn btn-outline-secondary rounded-pill px-4" onclick="alert('Verification Hash Verified: CERT-2026-CS101-001 is Authentic.')"><i class="bi bi-shield-check me-1"></i> Verify Authenticity</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/certificates.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Plans - Skill_Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar-wrapper">
      <a href="/dashboard.html" class="sidebar-brand"><i class="bi bi-diagram-3-fill text-primary me-2"></i>Skill_Map</a>
      <div class="sidebar-nav">
        <div class="nav-category">Main Console</div>
        <a href="/dashboard.html" class="nav-link-custom"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <div class="nav-category">Intelligence Engines</div>
        <a href="/pages/recommendations.html" class="nav-link-custom"><i class="bi bi-lightbulb"></i> Recommendations</a>
        <a href="/pages/learning-plans.html" class="nav-link-custom active"><i class="bi bi-journal-bookmark"></i> Learning Paths</a>
      </div>
      <div class="p-3 border-top"><button class="btn btn-outline-danger w-100" onclick="AuthManager.logout()">Sign Out</button></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="d-flex align-items-center">
          <button class="btn btn-light me-3" id="sidebarToggleBtn"><i class="bi bi-list fs-5"></i></button>
          <h5 class="fw-bold mb-0">Personalized Learning Paths Tracker</h5>
        </div>
      </header>

      <div class="p-4">
        <div class="card card-custom p-4 mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h5 class="fw-bold mb-1">Full Stack MERN Developer Certification Path</h5>
              <span class="badge bg-primary">In Progress</span>
            </div>
            <span class="fw-extrabold text-primary fs-4">42.5% Completed</span>
          </div>
          <div class="progress mb-3" style="height: 12px;">
            <div class="progress-bar bg-primary" role="progressbar" style="width: 42.5%"></div>
          </div>
          <div class="row g-3">
            <div class="col-md-3">
              <div class="p-3 bg-light rounded text-center">
                <small class="text-muted d-block">HTML / CSS</small>
                <span class="badge bg-success">Mastered</span>
              </div>
            </div>
            <div class="col-md-3">
              <div class="p-3 bg-light rounded text-center">
                <small class="text-muted d-block">JavaScript</small>
                <span class="badge bg-primary">Proficient</span>
              </div>
            </div>
            <div class="col-md-3">
              <div class="p-3 bg-light rounded text-center">
                <small class="text-muted d-block">React Hooks</small>
                <span class="badge bg-danger">Critical Gap</span>
              </div>
            </div>
            <div class="col-md-3">
              <div class="p-3 bg-light rounded text-center">
                <small class="text-muted d-block">Node & Express</small>
                <span class="badge bg-danger">Critical Gap</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/theme.js"></script>

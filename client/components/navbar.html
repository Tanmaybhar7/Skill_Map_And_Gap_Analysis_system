<header class="topbar">
  <div class="d-flex align-items-center">
    <button class="btn btn-icon btn-light me-3" id="sidebarToggleBtn">
      <i class="bi bi-list fs-5"></i>
    </button>
    <div class="search-input-group d-none d-md-block">
      <i class="bi bi-search"></i>
      <input type="text" class="form-control" placeholder="Search skills, users, gap reports...">
    </div>
  </div>

  <div class="d-flex align-items-center gap-3">
    <!-- Theme Toggle -->
    <button class="btn btn-light rounded-circle theme-toggle-btn p-2" title="Toggle Theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>

    <!-- Notifications Dropdown -->
    <div class="dropdown">
      <button class="btn btn-light rounded-circle position-relative p-2" data-bs-toggle="dropdown">
        <i class="bi bi-bell-fill"></i>
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          3
        </span>
      </button>
      <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 p-3" style="width: 320px;">
        <h6 class="fw-bold mb-3 d-flex justify-content-between">
          <span>Notifications</span>
          <small class="text-primary cursor-pointer">Mark all read</small>
        </h6>
        <div class="notification-list">
          <div class="p-2 border-bottom mb-2">
            <small class="fw-bold text-danger d-block">Critical Skill Gap Alert</small>
            <small class="text-muted">Node.js competency gap (56.25%) detected.</small>
          </div>
          <div class="p-2 border-bottom mb-2">
            <small class="fw-bold text-primary d-block">Assessment Assigned</small>
            <small class="text-muted">React Hooks & State Management Test assigned.</small>
          </div>
          <div class="p-2">
            <small class="fw-bold text-success d-block">Certificate Earned</small>
            <small class="text-muted">Web Development Masterclass Certificate issued.</small>
          </div>
        </div>
      </div>
    </div>

    <!-- User Profile Dropdown -->
    <div class="dropdown">
      <button class="btn btn-light d-flex align-items-center gap-2 border-0 bg-transparent" data-bs-toggle="dropdown">
        <div class="avatar-circle bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:40px; height:40px;">
          T
        </div>
        <div class="text-start d-none d-lg-block">
          <div class="fw-bold user-display-name text-truncate" style="max-width: 140px;">Tanmay Bhar</div>
          <small class="text-muted user-display-role d-block">Admin</small>
        </div>
        <i class="bi bi-chevron-down text-muted small ms-1"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0">
        <li><a class="dropdown-menu-item dropdown-item" href="/pages/settings.html"><i class="bi bi-person me-2"></i>My Profile</a></li>
        <li><a class="dropdown-menu-item dropdown-item" href="/pages/settings.html"><i class="bi bi-gear me-2"></i>Account Settings</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><button class="dropdown-item text-danger" onclick="AuthManager.logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
      </ul>
    </div>
  </div>
</header>
